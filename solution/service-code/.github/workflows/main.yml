name: Build and push

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Run the tests
        run: uv run python -m unittest -v

  push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for an OIDC token
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Read the version from pyproject.toml
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the image
        env:
          IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ steps.version.outputs.version }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Pushed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
