apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello
  strategy:
    rollingUpdate:
      maxSurge: 1       # one new Pod at a time...
      maxUnavailable: 0 # ...and an old one goes only when a new one is ready
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: 362099375729.dkr.ecr.eu-central-1.amazonaws.com/CHANGE-ME/hello:1.0.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
